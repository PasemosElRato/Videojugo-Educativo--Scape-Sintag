//  MOTOR
// ════════════════════════════════════════════════════════
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const T = 48;
const SETTLE_DELAY = 500; // ms que debe quedarse quieta una caja para evaluarse
const MAX_VIEW_W = 720, MAX_VIEW_H = 560; // tamaño máximo de ventana de juego; si el mapa es más grande, aparece cámara

const COL = {
  wall:'#3a1a6e', wallTop:'#5a2a9e',
  floor:'#2a0a5e', floorAlt:'#220855',
  plate:'#ffe066', plateCorrect:'#00ff99', plateWrong:'#ff4444',
  door:'#8B4513', doorOpen:'#5c94fc',
  bg:'#0a0020',
};

const PAR_COLORS = ['#e94560','#3a86ff','#06d6a0','#ffbe0b','#fb5607','#8338ec','#ff006e','#00b4d8','#f72585','#80b918'];
function parColor(n){ return PAR_COLORS[(n-1+1000)%PAR_COLORS.length]; }

// ── Estado del juego ──────────────────────────────────
let NIVEL, player, boxes, doorOpen, won, wrongFlash;
let errors=0, hintVisible=false, hintText='';
let spriteAnim='idle', spriteFrame=0, lastFrameTime=0;
const FRAME_DELAY=200;
let camX=0, camY=0;
let nivelActual=0, allDone=false;

let gameStarted=false;
const logoImg = new Image();
logoImg.src = 'logo.png';

function resizeCanvas(){
  const mapW = NIVEL.columnas*T;
  const mapH = NIVEL.filas*T;
  cv.width = Math.min(mapW, MAX_VIEW_W);
  cv.height = Math.min(mapH, MAX_VIEW_H);
}

function loadLevel(nv){
  if(boxes) boxes.forEach(b=>clearTimeout(b._timer));

  NIVEL = nv;
  player = { r: nv.jugador.r, c: nv.jugador.c };
  doorOpen = false; won = false; wrongFlash = 0;
  errors = 0; hintVisible = false; hintText='';

  boxes = nv.cajas.map(b=>({
    r: b.r, c: b.c, w: b.w||1, h: b.h||1,
    par: b.par, text: b.text,
    color: parColor(b.par),
    _gen: 0, _timer: null
  }));

  spriteAnim='idle'; spriteFrame=0;
  resizeCanvas();
}

function nextLevel(){
  nivelActual++;
  if(nivelActual>=NIVELES.length){
    allDone=true;
  } else {
    loadLevel(NIVELES[nivelActual]);
  }
}

loadLevel(NIVELES[nivelActual]);

// ── Input ─────────────────────────────────────────────
const keys={};
document.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]){ keys[e.code]=true; onKey(e.code); }
});

document.addEventListener('keydown', e=>{ if(!gameStarted) gameStarted=true; });
cv.addEventListener('click', ()=>{ if(!gameStarted) gameStarted=true; });

document.addEventListener('keyup', e=>keys[e.code]=false);

function onKey(code){
  if(allDone){
    if(code==='KeyR'){ nivelActual=0; allDone=false; loadLevel(NIVELES[0]); }
    return;
  }
  if(code==='KeyR'){ loadLevel(NIVELES[nivelActual]); return; }
  if(code==='KeyH'){ if(errors>0) hintVisible=!hintVisible; return; }

  let dr=0, dc=0;
  if(code==='ArrowLeft') { dc=-1; spriteAnim='left';  }
  if(code==='ArrowRight'){ dc= 1; spriteAnim='right'; }
  if(code==='ArrowUp')   { dr=-1; spriteAnim='up';    }
  if(code==='ArrowDown') { dr= 1; spriteAnim='down';  }
  if(!dr&&!dc) return;

  const nr=player.r+dr, nc=player.c+dc;
  if(isWall(nr,nc)){ spriteAnim='idle'; return; }

  if(!won){
    const box=boxAt(nr,nc);
    if(box){
      if(!tryPush(box,dr,dc)){ spriteAnim='idle'; return; }
      scheduleSettleCheck(box);
    }
  }

  player.r=nr; player.c=nc;
  setTimeout(()=>spriteAnim='idle',300);

  if(won && player.r===NIVEL.puerta.r && player.c===NIVEL.puerta.c){
    nextLevel();
  }
}

function isWall(r,c){
  if(r<0||r>=NIVEL.filas||c<0||c>=NIVEL.columnas) return true;
  const t=NIVEL.mapa[r][c];
  if(t==='pared') return true;
  if(t==='puerta'&&!doorOpen) return true;
  return false;
}

function boxAt(r,c, exclude=null){
  return boxes.find(b=> b!==exclude && r>=b.r && r<b.r+b.h && c>=b.c && c<b.c+b.w) || null;
}

function tryPush(box, dr, dc){
  const newR=box.r+dr, newC=box.c+dc;
  for(let rr=newR; rr<newR+box.h; rr++){
    for(let cc=newC; cc<newC+box.w; cc++){
      if(isWall(rr,cc)) return false;
      if(boxAt(rr,cc,box)) return false;
    }
  }
  box.r=newR; box.c=newC;
  return true;
}

// ── Lógica de placas: solo se evalúa si la caja queda quieta ──────
function scheduleSettleCheck(box){
  box._gen=(box._gen||0)+1;
  const gen=box._gen;
  clearTimeout(box._timer);
  box._timer=setTimeout(()=>settleCheck(box,gen), SETTLE_DELAY);
}

function settleCheck(box,gen){
  if(box._gen!==gen || won) return;
  const plate=NIVEL.placas.find(p=>p.r===box.r&&p.c===box.c);
  if(!plate) return;
  if(plate.par===box.par){
    const modo = NIVEL.ganarCon || 'cualquiera';
    if(modo==='todas') checkAllCorrect();
    else { doorOpen=true; won=true; }
  } else {
    errors++;
    wrongFlash=40;
    hintText=buildHint();
    hintVisible=false;
  }
}

// solo se usa cuando ganarCon === "todas"
function checkAllCorrect(){
  const allCorrect = boxes.every(b=>{
    const p=NIVEL.placas.find(pl=>pl.r===b.r&&pl.c===b.c);
    return p && p.par===b.par;
  });
  if(allCorrect){ doorOpen=true; won=true; }
}

function buildHint(){
  const hints=[];
  boxes.forEach(box=>{
    const correctPlate=NIVEL.placas.find(p=>p.par===box.par);
    if(correctPlate){
      hints.push(`"${box.text}" va en la placa que dice "${correctPlate.text}" (${correctPlate.r},${correctPlate.c})`);
    }
  });
  return hints.join(' | ');
}

// ── Cámara (sigue al jugador si el mapa es más grande que la vista) ──
function updateCamera(){
  const mapW=NIVEL.columnas*T, mapH=NIVEL.filas*T;
  const viewW=cv.width, viewH=cv.height;
  let tx=player.c*T+T/2-viewW/2;
  let ty=player.r*T+T/2-viewH/2;
  camX=Math.max(0, Math.min(tx, Math.max(0,mapW-viewW)));
  camY=Math.max(0, Math.min(ty, Math.max(0,mapH-viewH)));
}

// ── Dibujo ────────────────────────────────────────────
function drawWall(r,c){
  ctx.fillStyle=COL.wall; ctx.fillRect(c*T,r*T,T,T);
  ctx.fillStyle=COL.wallTop; ctx.fillRect(c*T,r*T,T,8);
  ctx.strokeStyle='#1a0a3e'; ctx.lineWidth=1;
  ctx.strokeRect(c*T+.5,r*T+.5,T-1,T-1);
}

function drawFloor(r,c){
  ctx.fillStyle=(r+c)%2===0?COL.floor:COL.floorAlt;
  ctx.fillRect(c*T,r*T,T,T);
}

function drawDoor(){
  const {r,c}=NIVEL.puerta;
  const x=c*T, y=r*T;
  ctx.fillStyle=doorOpen?COL.doorOpen:COL.door;
  ctx.fillRect(x+8,y,24,T);
  if(!doorOpen){ ctx.fillStyle='#ffd700'; ctx.fillRect(x+28,y+16,4,4); }
  else{ ctx.fillStyle='rgba(92,148,252,0.3)'; ctx.fillRect(x+4,y,32,T); }
  ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(x+8,y,24,T);
}

function fitFontSize(text, pxWidth){
  const len=Math.max(text.length,1);
  return Math.max(7, Math.min(11, Math.floor((pxWidth-8)/(len*0.62))));
}

function letraDelPar(par){
  const entry = NIVEL.leyenda && NIVEL.leyenda.find(l=>l.par===par);
  if(entry) return entry.letra;
  return String.fromCharCode(65 + (((par-1)%26+26)%26));
}

function drawPlate(p){
  const x=p.c*T, y=p.r*T, w=(p.w||1)*T, h=(p.h||1)*T;
  const box=boxAt(p.r,p.c);
  let col=COL.plate;
  if(box){ col=box.par===p.par?COL.plateCorrect:COL.plateWrong; }
  ctx.fillStyle=col; ctx.fillRect(x+3,y+3,w-6,h-6);
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=1;
  ctx.strokeRect(x+3,y+3,w-6,h-6);
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.strokeRect(x+7,y+7,w-14,h-14);
  ctx.setLineDash([]);
}

function drawBox(b){
  const x=b.c*T, y=b.r*T, w=b.w*T, h=b.h*T;
  const onCorrect=NIVEL.placas.some(p=>p.r===b.r&&p.c===b.c&&p.par===b.par);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x+4,y+h-14,w-8,6);
  ctx.fillStyle=onCorrect?COL.plateCorrect:b.color;
  ctx.fillRect(x+2,y+4,w-4,h-18);
  ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x+4,y+6,12,8);
  ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=2;
  ctx.strokeRect(x+2,y+4,w-4,h-18);
  ctx.fillStyle='#fff';
  ctx.font='bold 18px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(letraDelPar(b.par), x+w/2, y+(h-14)/2+2);
  ctx.textBaseline='alphabetic';
}

function drawPlayer(ts){
  const x=player.c*T, y=player.r*T;
  if(ts-lastFrameTime>FRAME_DELAY){ spriteFrame=(spriteFrame+1)%4; lastFrameTime=ts; }
  const S=3, cx=x+T/2, top=y+4;
  const legAnim=spriteAnim!=='idle';
  const legL=legAnim?(spriteFrame%2===0?2:0):1;
  const legR=legAnim?(spriteFrame%2===0?0:2):1;

  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(x+8,y+T-6,T-16,5);
  ctx.fillStyle='#f0f0f0'; ctx.fillRect(cx-11,top,21,21);
  ctx.strokeStyle='#222'; ctx.lineWidth=1; ctx.strokeRect(cx-11,top,21,21);
  ctx.fillStyle='#111';
  if(spriteAnim!=='up'){
    if(spriteAnim==='right') ctx.fillRect(cx+4,top+6,S,S);
    else if(spriteAnim==='left') ctx.fillRect(cx-7,top+6,S,S);
    else{ ctx.fillRect(cx-5,top+6,S,S); ctx.fillRect(cx+2,top+6,S,S); }
  }
  ctx.fillStyle='#ccc'; ctx.fillRect(cx-10,top,16,S);
  const bt=top+21;
  ctx.fillStyle='#2255cc'; ctx.fillRect(cx-6,bt,12,12);
  ctx.strokeStyle='#112288'; ctx.lineWidth=1; ctx.strokeRect(cx-6,bt,12,12);
  const pt=bt+12;
  ctx.fillStyle='#1a5c1a'; ctx.fillRect(cx-6,pt,12,9);
  ctx.fillRect(cx-6,pt+9-legL,4,3+legL);
  ctx.fillRect(cx+2,pt+9-legR,4,3+legR);
  ctx.fillStyle='#111';
  ctx.fillRect(cx-7,pt+12-legL,6,3);
  ctx.fillRect(cx+1,pt+12-legR,6,3);
}

function drawHUD(){
  const W=cv.width, H=cv.height;
  ctx.fillStyle='rgba(0,0,0,0.82)'; ctx.fillRect(0,0,W,52);
  ctx.fillStyle='#fff'; ctx.font='12px Courier New'; ctx.textAlign='left';
  ctx.fillText(`"${NIVEL.oracion}"`,10,14);
  ctx.fillStyle='#f8d800';
  ctx.fillText(`❓ ${NIVEL.pregunta}`,10,30);

  if(NIVEL.leyenda && NIVEL.leyenda.length){
    const texto = NIVEL.leyenda.map(l=>`${l.letra}: ${l.texto}`).join('   |   ');
    ctx.fillStyle='#7fdbff';
    ctx.font='11px Courier New';
    ctx.fillText(texto,10,46);
  }

  ctx.fillStyle='#aaa'; ctx.font='bold 11px Courier New'; ctx.textAlign='right';
  ctx.fillText(`Nivel ${nivelActual+1}/${NIVELES.length}`,W-10,46);

  if(errors>0){
    ctx.fillStyle='#ff4444'; ctx.font='bold 11px Courier New'; ctx.textAlign='right';
    ctx.fillText(`✗ Errores: ${errors}  [H] ver pista`,W-10,14);
  }

  if(wrongFlash>0){
    ctx.fillStyle=`rgba(255,0,0,${wrongFlash/40*0.28})`;
    ctx.fillRect(0,0,W,H);
    wrongFlash--;
  }

  if(hintVisible&&hintText){
    const bw=Math.min(520,W-40), bx=(W-bw)/2, by=Math.min(180,H/2-30), bh=60;
    ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='#ffbe0b'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#ffbe0b'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
    ctx.fillText('💡 PISTA',W/2,by+18);
    ctx.fillStyle='#fff'; ctx.font='11px Courier New';
    const words=hintText.split(' ');
    let line='', lines=[];
    const maxChars=Math.max(20,Math.floor(bw/8.5));
    words.forEach(w=>{ if((line+w).length>maxChars){lines.push(line);line='';}line+=w+' '; });
    lines.push(line);
    lines.slice(0,2).forEach((l,i)=>ctx.fillText(l.trim(),W/2,by+34+i*14));
  }

  // banner delgado (no bloquea la vista) cuando ya ganaste el nivel
  if(won){
    ctx.fillStyle='rgba(0,40,20,0.88)'; ctx.fillRect(0,H-26,W,26);
    ctx.strokeStyle='#00ff99'; ctx.lineWidth=1; ctx.strokeRect(0,H-26,W,26);
    ctx.fillStyle='#00ff99'; ctx.font='bold 12px Courier New'; ctx.textAlign='center';
    ctx.fillText('✅ ¡Correcto! Camina hacia la puerta →',W/2,H-9);
  }
}

function drawCompletionScreen(){
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#00ff99'; ctx.font='bold 20px Courier New'; ctx.textAlign='center';
  ctx.fillText('🏆 ¡Completaste todos los niveles!',cv.width/2,cv.height/2-12);
  ctx.fillStyle='#aaa'; ctx.font='12px Courier New';
  ctx.fillText('R → Reiniciar desde el nivel 1',cv.width/2,cv.height/2+18);
}

function drawStartScreen(){
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,cv.width,cv.height);
  if(logoImg.complete && logoImg.naturalWidth>0){
    const maxW=cv.width*0.7, maxH=cv.height*0.5;
    const scale=Math.min(maxW/logoImg.naturalWidth, maxH/logoImg.naturalHeight);
    const w=logoImg.naturalWidth*scale, h=logoImg.naturalHeight*scale;
    ctx.drawImage(logoImg, (cv.width-w)/2, (cv.height-h)/2-20, w, h);
  } else {
    ctx.fillStyle='#fff'; ctx.font='bold 22px Courier New'; ctx.textAlign='center';
    ctx.fillText('SCAPE SINTAG',cv.width/2,cv.height/2-20);
  }
  ctx.fillStyle='#7fdbff'; ctx.font='bold 13px Courier New'; ctx.textAlign='center';
  ctx.fillText('Presiona cualquier tecla o haz clic para empezar',cv.width/2,cv.height-20);
}

// ── Loop principal ────────────────────────────────────
function draw(ts){
  if(!gameStarted){
    drawStartScreen();
    requestAnimationFrame(draw);
    return;
  }
  if(allDone){
  ...

  updateCamera();
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,cv.width,cv.height);

  ctx.save();
  ctx.translate(-camX,-camY);

  for(let r=0;r<NIVEL.filas;r++){
    for(let c=0;c<NIVEL.columnas;c++){
      const t=NIVEL.mapa[r][c];
      if(t==='pared') drawWall(r,c);
      else drawFloor(r,c);
    }
  }
  NIVEL.placas.forEach(drawPlate);
  drawDoor();
  boxes.forEach(drawBox);
  drawPlayer(ts);

  ctx.restore();
  drawHUD();
  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
